<section id="freshS3" class="panel"><h2>Fresh S3 — actual student training inside the tower</h2><p id="freshSummary"></p><p>Targets are fresh Qwen feedback pseudo-labels. Combined input includes teacher answers; source-only holdout is the independent-input diagnostic. One S3 document, paragraph holdout; no corpus generalization or semantic admission established.</p><button id="freshSourceButton">Full S3 input spec</button><select id="freshParagraph"></select><button id="freshGraphButton">Typed concept network</button><button id="freshTrainingButton">Optimizer timeline</button><button id="freshLogitsButton">Held-out logits</button><button id="freshPromptsButton">Exact fresh requests and responses</button><svg id="freshNetwork" viewBox="0 0 1000 480" style="width:100%;height:480px;background:#101827"></svg><pre id="freshDetail" style="max-height:650px;overflow:auto;white-space:pre-wrap"></pre></section>
<script>(()=>{const F=FRESH_S3_REPORT, P=FRESH_S3_PROMPTS;const q=s=>document.querySelector(s);q('#freshSummary').textContent=`New ${F.parameters.toLocaleString()} parameter student • ${F.training_steps} optimizer steps • ${Object.values(F.fresh_calls).reduce((a,b)=>a+b,0)} fresh calls • ${F.retained_responses_used} reused responses • live step ${F.training_steps}, frozen step ${F.incumbent_step} • weights changed: ${F.weights_changed}. Run: ${F.run}`;
for(const r of F.records){let o=document.createElement('option');o.value=r.id;o.textContent=r.id+' — '+r.split;q('#freshParagraph').append(o)}
const detail=x=>q('#freshDetail').textContent=JSON.stringify(x,null,2),ns='http://www.w3.org/2000/svg';function el(tag,attrs,text){let n=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n}
function draw(){const r=F.records.find(r=>r.id===q('#freshParagraph').value),g=r.graph,s=q('#freshNetwork');s.replaceChildren();let n=g.types.length,pos=g.types.map((_,i)=>({x:500+360*Math.cos(i*2*Math.PI/n),y:240+175*Math.sin(i*2*Math.PI/n)}));for(const[a,b,role,p]of g.edges){s.append(el('line',{x1:pos[a].x,y1:pos[a].y,x2:pos[b].x,y2:pos[b].y,stroke:role==='member'?'#334155':'#67e8f9','stroke-width':role==='member'?1:2}));if(role!=='member')s.append(el('text',{x:(pos[a].x+pos[b].x)/2,y:(pos[a].y+pos[b].y)/2,fill:'#facc15','font-size':11},role+':'+p))}g.types.forEach((t,i)=>{s.append(el('circle',{cx:pos[i].x,cy:pos[i].y,r:8,fill:t.startsWith('relation:')?'#facc15':'#38bdf8'}));s.append(el('text',{x:pos[i].x,y:pos[i].y-12,'text-anchor':'middle',fill:'#e2e8f0','font-size':11},t));});detail({source:r.text,teacher_targets:r.labels,typed_graph:g,observations:r.observations});}
q('#freshSourceButton').onclick=()=>detail({source_path:F.source_path,sha256:F.source_sha256,source:F.full_source});q('#freshParagraph').onchange=draw;q('#freshGraphButton').onclick=draw;q('#freshTrainingButton').onclick=()=>detail({initial_weights:F.initial_weights_sha256,final_weights:F.final_weights_sha256,interior_training_verified:F.interior_training_verified,resume_events:F.resume_events,evidence_limitations:F.evidence_limitations,history:F.history,events:F.events,research_graph:F.research_graph});q('#freshLogitsButton').onclick=()=>detail({checkpoint_replay:F.checkpoint_replay,validation_baseline:F.validation_baseline,test:F.test,ablations:F.ablations,heads:F.heads});q('#freshPromptsButton').onclick=()=>detail(P[q('#freshParagraph').value]);draw();})();</script>
