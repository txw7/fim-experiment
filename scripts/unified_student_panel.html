<style>
#unifiedStudent .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
#unifiedStudent .metric{font-size:26px;font-weight:700}
#unifiedStudent .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#unifiedStudent .controls button{cursor:pointer;background:#172338;color:#dfeaff;border:1px solid #56718a;padding:8px 12px;border-radius:5px}
#unifiedStudent pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<section class="panel" id="unifiedStudent">
  <h2>SHG composition + typed observer student</h2>
  <div id="unifiedCards" class="grid"></div>
  <p id="unifiedScope"></p>
  <div class="controls">
    <button id="unifiedPipeline">Combined flow</button>
    <button id="unifiedObjects">Objects and incidences</button>
    <button id="unifiedFeed">Typed input tokens</button>
    <button id="unifiedPrompts">Exact observer prompts</button>
    <button id="unifiedSpec">S3 spec trial</button>
    <button id="unifiedConceptTargets">S3 concept targets</button>
    <button id="unifiedTraining">Interior training updates</button>
    <label>Probe <select id="unifiedProbe"></select></label>
    <label><input type="checkbox" id="unifiedMasked"> Mask observers</label>
  </div>
  <p id="unifiedPrediction"></p>
  <svg id="unifiedGraph" viewBox="0 0 1200 620" aria-label="SHG student input and result network"></svg>
  <pre id="unifiedDetail" class="detail small" style="max-height:350px;overflow:auto"></pre>
  <div class="cards">
    <article><h3>Generated controls · held-out parent compositions</h3><div id="unifiedMetrics" class="tablewrap"></div></article>
    <article><h3>Misses</h3><div id="unifiedFails" class="tablewrap"></div></article>
  </div>
  <details><summary>Source, label authority, checkpoint and provenance</summary><pre id="unifiedProvenance" class="small" style="white-space:pre-wrap"></pre></details>
</section>
<script>
(()=>{
const U=UNIFIED_REPORT, I=UNIFIED_INPUT, P=UNIFIED_PROBES, O=UNIFIED_OBJECTS, T=UNIFIED_OBSERVER_REQUESTS, S=UNIFIED_SPEC_TRIAL;
const q=id=>document.getElementById(id), svg=q('unifiedGraph'), ns='http://www.w3.org/2000/svg';
const f=x=>Number(x).toFixed(3); let mode=S?'spec':'pipeline';
function detail(value){q('unifiedDetail').textContent=typeof value==='string'?value:JSON.stringify(value,null,2)}
function el(tag,attrs={},text){let x=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(attrs))x.setAttribute(k,v);if(text!==undefined)x.textContent=text;svg.append(x);return x}
function edge(a,b,role){el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#8395ac','stroke-width':1});if(role){let x=el('text',{x:(a[0]+b[0])/2,y:(a[1]+b[1])/2-4},role);x.style.fontSize='10px'}}
function node(id,label,x,y,data,color='#67d4e8',size=9){let c=el('circle',{cx:x,cy:y,r:size,fill:color});let t=el('title',{},label);c.append(t);c.onclick=()=>detail(data);el('text',{x:x+size+4,y:y+4},label)}
q('unifiedCards').innerHTML=`<article class="card"><div class="metric">${U.parameters.toLocaleString()}</div><div>Tiny student parameters · CPU</div></article><article class="card"><div class="metric">${U.data.actual_objects} objects</div><div>${U.data.actual_native_coordinates} native coordinates · 1 authored source group</div></article><article class="card"><div class="metric">${U.data.generated_records.train} controls</div><div>${U.data.generated_parent_groups.train} generated train parent groups</div></article><article class="card"><div class="metric">${U.steps} updates</div><div>Frozen checkpoint step ${U.incumbent_step} · ${U.elapsed_seconds.toFixed(1)}s</div></article>`;
q('unifiedScope').textContent='Control training uses generated typed compositions and explicitly simulated observer observations. The real Jev/Laya/Qwen comparison is a separate probe. Real corpus held-out accuracy and real observer calibration are unavailable.';
q('unifiedProbe').innerHTML=P.map((p,i)=>`<option value="${i}">${i===0?'Native export':'Constructed control'} · ${p.id.split(':').at(-1)}</option>`).join('');
let metrics=[['Combined',U.test],['Graph only',U.input_mask_ablations_same_checkpoint.graph_only],['Observers only',U.input_mask_ablations_same_checkpoint.observations_only],['Both masked',U.input_mask_ablations_same_checkpoint.both_masked]];
q('unifiedMetrics').innerHTML='<table><thead><tr><th>Same checkpoint</th><th>Accuracy</th><th>Macro F1</th><th>Brier</th><th>Shape accuracy</th></tr></thead><tbody>'+metrics.map(([n,m])=>`<tr><td>${n}</td><td>${f(m.accuracy)}</td><td>${f(m.macro_f1)}</td><td>${f(m.brier)}</td><td>${f(m.shape_accuracy)}</td></tr>`).join('')+`<tr><td>Majority baseline</td><td>${f(U.majority_test_accuracy)}</td><td colspan="3">${U.test.n} controls / ${U.data.generated_parent_groups.test} disjoint parent groups</td></tr></tbody></table>`;
let misses=U.test.predictions.filter(p=>p.prediction!==p.target||p.shape_prediction!==p.shape_target);
q('unifiedFails').innerHTML=misses.length?'<table><thead><tr><th>Generated composition</th><th>Support</th><th>Shape: target → model</th></tr></thead><tbody>'+misses.map(p=>`<tr><td>${p.id}</td><td>${p.prediction===p.target?'pass':'FAIL'}</td><td>${p.shape_target} → ${p.shape_prediction}</td></tr>`).join('')+'</tbody></table>':'No support or composition-shape misses in these generated controls.';
q('unifiedProvenance').textContent=JSON.stringify({source:I.source,source_fidelity:I.source_fidelity,run:U.run,pins:U.pins,labels:U.symbolic_control_authority,training_observations:U.data.observer_training,real_observer_training_examples:U.data.real_observer_training_examples,promotion:U.promotion,native_semantic_admission:U.native_semantic_admission,research_graph:U.research_graph||'Measurement import pending'},null,2);
function selected(){return Number(q('unifiedProbe').value)}
function prediction(){let masked=q('unifiedMasked').checked, p=(masked?U.real_fixture_without_observers:U.real_fixture_probe).predictions[selected()];q('unifiedPrediction').textContent=`${p.id} · model p(support) ${f(p.support_probability)} · model ${p.prediction?'supported':'unsupported'} · bounded reference ${p.target?'supported':'unsupported'} · shape ${p.shape_prediction} · scores uncalibrated`;return p}
function pipeline(){svg.replaceChildren();let positions={source:[60,120],graph:[300,120],observers:[60,330],tokens:[300,330],student:[575,230],labels:[820,230],checks:[815,475],rg:[1060,350]};let titles={source:'Native SHG + source',graph:'Typed incidence encoder',observers:'Jev / Laya / Qwen',tokens:'Typed bins + missing',student:'Tiny transformer',labels:'Support / shape logits',checks:'Source / schema checks',rg:'ResearchGraph records'};U.pipeline_graph.edges.forEach(e=>edge(positions[e.source],positions[e.target]));U.pipeline_graph.nodes.forEach(n=>{let data=n.id==='source'?{source:I.source,graph:P[selected()].graph}:n.id==='tokens'?{typed_tokens:UNIFIED_TOKEN_FUNCTION(P[selected()].observations),observations:P[selected()].observations}:n.id==='labels'?prediction():n.id==='student'?{parameters:U.parameters,architecture:U.architecture,step:U.incumbent_step}:n.id==='checks'?I.source_fidelity:n.id==='rg'?U.research_graph||{native_semantic_admission:'NOT_RUN'}:n.id==='observers'?P[selected()].observations:U.history;node(n.id,titles[n.id],...positions[n.id],data,n.id==='labels'?'#f1c878':'#67d4e8',12)});detail({input:'88 native objects + typed observer slots; graph labels/identity hashes are excluded from input features',selected_probe:prediction(),streaming:U.streaming})}
function objects(){svg.replaceChildren();let g=P[selected()].graph,pos=[],counts={},colors={operator:'#f1c878',relation:'#b69aff',network:'#67d4e8',binder:'#8fd28f','variable-use':'#edaa59',port:'#8fd28f','proof-parameter':'#8fd28f'};g.native_ids.forEach((id,i)=>{let group=/^N([1-5])/.exec(id),column=group?Number(group[1])-1:id==='R4'?3:4;column=Math.min(column,4);let ordinal=counts[column]||0;counts[column]=ordinal+1;pos[i]=[65+column*232+(g.nodes[i].type.startsWith('relation:')?35:0),40+ordinal*18]});g.incidences.forEach(e=>edge(pos[e.relation],pos[e.participant]));g.nodes.forEach((n,i)=>{let id=g.native_ids[i],kind=n.type.split(':')[0],label=kind==='operator'?n.type.split(':')[1]:kind==='relation'?n.type.split(':')[1]:kind==='variable-use'?'variable use':kind==='binder'?'binder':id.includes('/')?id.split('/').at(-1):id;node(id,label,...pos[i],{native_id:id,typed_node:n,original_object:selected()===0?O.find(o=>o.id===id):undefined,incidences:g.incidences.filter(e=>e.relation===i||e.participant===i).map(e=>({...e,relation_id:g.native_ids[e.relation],participant_id:g.native_ids[e.participant]}))},colors[kind]||'#8494aa',kind==='network'?9:kind==='operator'?6:4)});detail({objects:g.nodes.length,incidences:g.incidences.length,query_root:g.query_native_id,authority:selected()===0?'Native export, semantic admission NOT_RUN':'Constructed structural control, not a native export',instruction:'Click an operator, binder, network or relation to inspect its exact typed participants.'})}
function tokens(){svg.replaceChildren();let tokens=[...(P[selected()].typed_graph_tokens||[]),...UNIFIED_TOKEN_FUNCTION(q('unifiedMasked').checked?{}:P[selected()].observations)];tokens.forEach((t,i)=>node(t,t,35+(i%4)*295,25+Math.floor(i/4)*20,{typed_token:t,slot_index:i},t.includes('MISSING')?'#8494aa':'#67d4e8',4));detail({typed_graph_and_observation_tokens:tokens,raw_observations:P[selected()].observations,Qwen_missing_scores:'Qwen returns choice and explanation; its probability/confidence slots remain MISSING.'})}
function training(){svg.replaceChildren();let history=U.history,maxStep=U.steps,maxLoss=Math.max(U.initial_validation.logloss,...history.map(h=>h.validation.logloss)),last=null;history.forEach(h=>{let p=[60+1060*h.step/maxStep,530-450*h.validation.logloss/maxLoss];if(last)edge(last,p);node(h.step,`${h.step} updates / ${h.watermark} records`,...p,h,h.promoted?'#8fd28f':'#edaa59',5);last=p});detail({interior_updates:U.streaming,checkpoint_promotion:U.promotion,history:history,initial_validation:U.initial_validation})}
function prompts(){svg.replaceChildren();Object.entries(T.requests||{}).forEach(([name,request],i)=>{let a=[80+i*290,180],b=[80+i*290,380];edge(a,b,'retained response');node(name,name,...a,{request,scope:T.scope},'#67d4e8',12);node(name+'-response','choice / scores',...b,{response:T.responses[name],request},'#f1c878',10)});detail(T)}
function spec(){svg.replaceChildren();if(!S){detail('No external spec trial recorded.');return}let positions={},counts={};S.objects.forEach(o=>{let i=counts[o.kind]||0;counts[o.kind]=i+1;positions[o.id]=o.kind==='claim'?[65,60+i*82]:o.kind==='operator'?[355,45+i*66]:o.kind==='inference'?[620,165]:o.kind==='network'?[950,170]:o.kind==='network-composition'?[750,345]:[965,505]});S.graph.incidences.forEach(e=>edge(positions[S.graph.native_ids[e.relation]],positions[S.graph.native_ids[e.participant]],e.role+' / '+e.position));S.objects.forEach(o=>node(o.id,o.kind==='operator'?'lexical '+o.operator:o.id+' · '+o.kind,...positions[o.id],{object:o,source:S.source_path,student_state:S.student.state},o.kind==='operator'?'#f1c878':o.kind.includes('composition')?'#b69aff':'#67d4e8',o.kind==='operator'?6:10));q('unifiedPrediction').textContent=`S3_LIVE_AB · ${S.objects.length} source-anchored objects · ${S.student.state} · no logits · ${S.retained_window_scope}`;detail({source:S.source_path,student:S.student,unknown_features:S.unknown_input_features,checkpoint_classes:S.checkpoint_label_space,document_type:{Qwen:S.qwen_document_type,source:S.expected_document_type,match:S.document_type_match},retained_observer_cases:S.retained_observer_cases,concept_mapping:S.concept_mapping,provenance:S.research_graph,pins:S.pins})}
function conceptTargets(){svg.replaceChildren();if(!S){detail('No S3 mappings recorded.');return}let examples=S.concept_mapping||[],concepts=[...new Set(examples.flatMap(e=>e.concept_refs))],positions={};concepts.forEach((id,i)=>{positions[id]=[65+(i%5)*230,380+Math.floor(i/5)*85]});examples.forEach((e,i)=>{let p=[65+i*285,115];e.concept_refs.forEach(id=>edge(p,positions[id]));node('mapping-'+i,e.proposed_dimensions.constraint,...p,e,'#f1c878',12)});concepts.forEach(id=>node(id,id,...positions[id],{concept_id:id,type:id.split(':')[0],authority:'Authored analysis concept; not a runtime identity'},'#67d4e8',8));q('unifiedPrediction').textContent='S3 concept targets · source-anchored authored mappings · not model predictions or admitted facts';detail({classification_dimensions:['concept role','constraint mode','relation','composition'],examples,student_status:S.student.state})}
function render(){let external=['spec','conceptTargets'].includes(mode);q('unifiedProbe').disabled=external;q('unifiedMasked').disabled=external;q('unifiedScope').textContent=external?'Frozen choice-composition checkpoint. S3 uses retained native semantic records and recorded observer outputs. This run made zero observer calls and zero training updates; the concept targets are authored examples.':'Control training uses generated typed compositions and explicitly simulated observer observations. The real Jev/Laya/Qwen comparison is a separate probe. Real corpus held-out accuracy and real observer calibration are unavailable.';prediction();({pipeline,objects,tokens,training,prompts,spec,conceptTargets})[mode]()}
q('unifiedPipeline').onclick=()=>{mode='pipeline';render()};q('unifiedObjects').onclick=()=>{mode='objects';render()};q('unifiedFeed').onclick=()=>{mode='tokens';render()};q('unifiedPrompts').onclick=()=>{mode='prompts';render()};q('unifiedSpec').onclick=()=>{mode='spec';render()};q('unifiedConceptTargets').onclick=()=>{mode='conceptTargets';render()};q('unifiedTraining').onclick=()=>{mode='training';render()};q('unifiedProbe').onchange=render;q('unifiedMasked').onchange=render;render();
})();
</script>
