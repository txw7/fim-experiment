<section class="panel" id="connectivityStudent"><h2>Connectivity — identities, operands, scope and flow</h2><p id="connectionSummary"></p><p>Source network: authored, span-anchored candidate. Student: trained on generated typed compositions, with the S3 graph held out. This measures graph reading, not extraction accuracy or proof.</p><select id="connectionLayer"><option value="architecture">Nested supervision and pairs</option><option value="identity">Dependencies and aliases across paragraphs</option><option value="flow">Ordered execution flow</option><option value="gate">Conditional scope and negation</option><option value="all">Whole connected specification</option></select><label><input type="checkbox" id="connectionPredictions">Student predicted connections</label><button id="connectionMetrics">Student connectivity results</button><button id="connectionPrompts">Exact connection questions</button><button id="connectionEvidence">Source incidences and training proof</button><svg id="connectionNetwork" viewBox="0 0 1100 540" style="width:100%;height:540px;background:#101827"></svg><pre id="connectionDetail" style="max-height:650px;overflow:auto;white-space:pre-wrap"></pre></section>
<script>(()=>{const C=CONNECTIVITY_REPORT,P=CONNECTIVITY_PROMPTS,g=C.source_graph,q=s=>document.querySelector(s),ns='http://www.w3.org/2000/svg';q('#connectionSummary').textContent=`${g.nodes.length} objects • ${g.edges.length} directed incidences • ${C.parameters.toLocaleString()} parameters • ${C.steps} optimizer updates • frozen step ${C.incumbent_step} • generated holdout exact-incidence F1 ${C.exact_incidence_metrics.incumbent.generated_exact_incidence.f1.toFixed(3)} • S3 candidate exact-incidence F1 ${C.exact_incidence_metrics.incumbent.source_exact_incidence.f1.toFixed(3)}`;const detail=x=>q('#connectionDetail').textContent=JSON.stringify(x,null,2);function el(t,a,text){let n=document.createElementNS(ns,t);for(let[k,v]of Object.entries(a))n.setAttribute(k,v);if(text)n.textContent=text;return n}
function draw(){let mode=q('#connectionLayer').value,roots=mode==='architecture'?g.nodes.map((n,i)=>n.id==='architecture'?i:-1):mode==='identity'?g.nodes.map((n,i)=>['aliases','depends-on'].includes(n.kind)?i:-1):mode==='flow'?g.nodes.map((n,i)=>n.id==='operator:execution-sequence'||n.kind==='flows-to'||n.kind==='EXACTLY_ONCE'?i:-1):mode==='gate'?g.nodes.map((n,i)=>n.id==='operator:unavailable-gate'?i:-1):[g.root];roots=roots.filter(i=>i>=0);let selected=new Set(roots),levels=new Map(roots.map(i=>[i,0])),queue=roots.slice();while(queue.length){let a=queue.shift();for(let e of g.edges.filter(e=>e.source===a&&e.role!=='scope'))if(!selected.has(e.target)){selected.add(e.target);levels.set(e.target,levels.get(a)+1);queue.push(e.target)}}let nodes=[...selected],groups={};for(let i of nodes)(groups[levels.get(i)]??=[]).push(i);let pos={},max=Math.max(...Object.keys(groups).map(Number));for(let[d,items]of Object.entries(groups))items.forEach((i,j)=>pos[i]={x:70+(960*(j+1)/(items.length+1)),y:65+410*Number(d)/Math.max(1,max)});let s=q('#connectionNetwork');s.replaceChildren();let defs=el('defs',{}),marker=el('marker',{id:'connectionArrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#67e8f9'}));defs.append(marker);s.append(defs);let edges=g.edges.filter(e=>selected.has(e.source)&&selected.has(e.target));if(q('#connectionPredictions').checked){let index=new Map(g.nodes.map((n,i)=>[n.id,i]));edges=C.source_candidate.predictions[0].predicted_edges.map(e=>({...e,source:index.get(e.source),target:index.get(e.target)})).filter(e=>selected.has(e.source)&&selected.has(e.target));}for(let e of edges){let a=pos[e.source],b=pos[e.target],scope=e.role==='scope';s.append(el('line',{x1:a.x,y1:a.y+8,x2:b.x,y2:b.y-10,stroke:q('#connectionPredictions').checked?'#fb7185':scope?'#f472b6':'#67e8f9','stroke-width':scope?1:2,'stroke-dasharray':scope?'5 4':'none','marker-end':'url(#connectionArrow)'}));s.append(el('text',{x:(a.x+b.x)/2+6,y:(a.y+b.y)/2,fill:scope?'#f472b6':'#facc15','font-size':11},e.role+'['+e.position+']'))}for(let i of nodes){let n=g.nodes[i],p=pos[i];s.append(el('circle',{cx:p.x,cy:p.y,r:9,fill:n.kind==='agent'||n.kind==='stage'?'#34d399':n.kind==='use'?'#a78bfa':'#facc15'}));let t=el('text',{x:p.x,y:p.y-15,'text-anchor':'middle',fill:'#e2e8f0','font-size':12},n.label);t.append(el('title',{},n.id+' · '+n.kind));s.append(t)}detail({layer:mode,view:q('#connectionPredictions').checked?'student prediction; fallible':'authored source candidate',objects:nodes.map(i=>g.nodes[i]),incidences:edges.map(e=>({...e,source:g.nodes[e.source].id,target:g.nodes[e.target].id})),scope_edges:'Pink dashed edges bind nested operator occurrences to their enclosing operator.',binding_edges:'Use occurrences point to canonical identities; aliases remain directed relations between distinct objects.'});}
q('#connectionPredictions').onchange=draw;q('#connectionLayer').onchange=draw;q('#connectionMetrics').onclick=()=>detail({heads:C.heads,exact_incidence_metrics:C.exact_incidence_metrics,generated_holdout:C.generated_holdout,frozen_S3:C.source_candidate,live_S3:C.live_source_candidate,limits:C.limits});q('#connectionPrompts').onclick=()=>detail({checks:C.observer_checks,exact_requests_and_responses:P});q('#connectionEvidence').onclick=()=>detail({source_graph:g,run:C.run,history:C.history,events:C.events,checkpoint_replay_verified:C.checkpoint_replay_verified,weights_changed:C.weights_changed,pins:C.pins,research_graph:C.research_graph});draw();})();</script>
